<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Vlog — 趙喚好運</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
<header>
  <a href="index.html" class="site-title"><span class="clv">☘</span> 趙喚好運</a>
  <div class="header-right">
    <nav>
      <a href="works.html">作品集</a>
      <a href="ads.html">廣告演出</a>
      <a href="timeline.html">時序年表</a>
      <a href="vlog.html">Vlog</a>
      <a href="links.html">官方連結</a>
      <a href="about.html">關於</a>
    </nav>
    <button class="toggle-btn" id="themeToggle" title="切換深色模式" aria-label="切換深色模式"></button>
  </div>
</header>

<div class="page-hero">
  <div class="page-hero-inner">
    <a href="index.html" class="page-hero-back">← 返回首頁</a>
    <div class="page-hero-title">Vlog</div>
    <div class="page-hero-sub">@tanyadreamlife</div>
    <div class="page-hero-desc">
      <p>每天都是限量版的一天。<br>
      趙妮綺的 YouTube Vlog 頻道記錄。<br>
      點擊縮圖可前往 YouTube 觀看完整影片。</p>
    </div>
  </div>
</div>

<div class="section">
  <div class="section-header">
    <div class="section-title">Vlog 影片</div>
    <a href="https://www.youtube.com/@tanyadreamlife" target="_blank" class="view-all-btn">前往頻道 ↗</a>
  </div>

  <div class="yt-grid">

    <!-- 每部 Vlog 影片：把 VIDEO_ID 換成實際 YouTube ID -->
    <div class="yt-card">
      <a href="https://www.youtube.com/watch?v=QkE-CqbDPWQ" target="_blank" class="yt-thumb-wrap">
        <img class="yt-thumb" src="https://img.youtube.com/vi/QkE-CqbDPWQ/mqdefault.jpg" alt="Vlog" loading="lazy">
        <div class="yt-play-btn"></div>
      </a>
      <div class="yt-info">
        <div class="yt-badge-row"><span class="badge badge-sub">Vlog</span></div>
        <div class="yt-title">Tanya's Vlog</div>
        <div class="yt-sub">@tanyadreamlife</div>
      </div>
    </div>

    <!-- 可以繼續往下複製這個區塊新增更多影片 -->

  </div>

  <div class="note-card" style="margin-top:1.6rem">
    <p>
      Vlog 影片持續更新中，如有新影片歡迎提供影片 ID 補充。<br>
      所有內容版權屬趙妮綺本人所有。<br>
      若原始影片下架，縮圖與連結亦將失效。
    </p>
  </div>
</div>

<footer><div class="footer-inner">
  <div>趙喚好運 &nbsp;·&nbsp; 趙妮綺非官方記錄站</div>
  <div>內容僅供個人紀錄用，版權屬原著作人所有。</div>
</div></footer>
<button class="back-top-fixed" id="backTop" title="回到頂端">↑</button>
<script>
  const btn=document.getElementById("themeToggle");
  if(localStorage.getItem("theme")==="dark")document.documentElement.setAttribute("data-theme","dark");
  btn.addEventListener("click",()=>{const d=document.documentElement.getAttribute("data-theme")==="dark";document.documentElement.setAttribute("data-theme",d?"light":"dark");localStorage.setItem("theme",d?"light":"dark");});
  const btt=document.getElementById("backTop");
  window.addEventListener("scroll",()=>btt.classList.toggle("visible",window.scrollY>300));
  btt.addEventListener("click",()=>window.scrollTo({top:0,behavior:"smooth"}));
</script>
</body></html>
