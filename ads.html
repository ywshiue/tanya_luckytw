<!DOCTYPE html>
<html lang="zh-TW">
<head>

  <link rel="stylesheet" href="css/style.css">
</head>
<body>
<header>
  <a href="index.html" class="site-title"><span class="clv">☘</span> 趙喚好運</a>
  <div class="header-right">
    <nav>
      <a href="works.html">作品集</a>
      <a href="ads.html" class="active">廣告演出</a>
      <a href="timeline.html">時序年表</a>
      <a href="vlog.html">Vlog</a>
      <a href="links.html">官方連結</a>
      <a href="about.html">關於</a>
    </nav>
    <button class="toggle-btn" id="themeToggle" title="切換深色模式" aria-label="切換深色模式"></button>
  </div>
</header>

<div class="page-hero">
  <div class="page-hero-inner">
    <a href="index.html" class="page-hero-back">← 返回首頁</a>
    <div class="page-hero-title">廣告演出</div>
    <div class="page-hero-sub">Commercial Works</div>
    <div class="page-hero-desc">
      <p>記錄趙妮綺參與的商業廣告作品。<br>點擊縮圖可前往 YouTube 觀看。版權屬原著作人所有。</p>
    </div>
  </div>
</div>

<div class="section">
  <div class="section-header">
    <div class="section-title">廣告作品 <span class="count-tag">1 支</span></div>
  </div>

  <div class="yt-grid">

    <div class="yt-card">
      <div class="yt-embed-wrap">
        <iframe
          src="https://www.youtube.com/embed/uwdsk8jaPF4"
          title="2026聯邦台WAY大賞 說台語才夠味"
          allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture"
          allowfullscreen
          loading="lazy">
        </iframe>
      </div>
      <div class="yt-info">
        <div class="yt-badge-row">
          <span class="year-tag">2026</span>
          <span class="badge badge-ad">廣告</span>
        </div>
        <div class="yt-title">2026 聯邦台 WAY 大賞｜說台語才夠味</div>
        <div class="yt-sub">聯邦商業銀行</div>
        <div class="yt-date">以台語為主題，傳遞在地文化活力與品牌精神。</div>
      </div>
    </div>

  </div>

  <div class="note-card" style="margin-top:1.6rem">
    <p>若有遺漏的廣告演出資料，歡迎提供補充。<br>
    所有內容僅供記錄，版權屬原著作人所有。<br>
    若原始影片下架，縮圖與連結亦將失效。</p>
  </div>
</div>

<footer><div class="footer-inner">
  <div>趙喚好運 &nbsp;·&nbsp; 趙妮綺非官方記錄站</div>
  <div>內容僅供個人紀錄用，版權屬原著作人所有。</div>
</div></footer>
<button class="back-top-fixed" id="backTop" title="回到頂端">↑</button>
<script>
  const btn=document.getElementById("themeToggle");
  if(localStorage.getItem("theme")==="dark")document.documentElement.setAttribute("data-theme","dark");
  btn.addEventListener("click",()=>{const d=document.documentElement.getAttribute("data-theme")==="dark";document.documentElement.setAttribute("data-theme",d?"light":"dark");localStorage.setItem("theme",d?"light":"dark");});
  const btt=document.getElementById("backTop");
  window.addEventListener("scroll",()=>btt.classList.toggle("visible",window.scrollY>300));
  btt.addEventListener("click",()=>window.scrollTo({top:0,behavior:"smooth"}));
</script>
</body></html>
